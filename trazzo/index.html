<style>
:root{--navy:#0b1f3a;--navy2:#13294b;--gold:#d9a441;--steel:#5d7a9c;--bg:#f6f7f9;--card:#fff;--text:#14233a;--muted:#5b6778;--border:#e2e6ec}
@media (prefers-color-scheme:dark){:root{--bg:#0a1626;--card:#102038;--text:#eef2f7;--muted:#9fb0c6;--border:#1f3354}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:18px;text-decoration:none}
.brand img{width:36px;height:36px;border-radius:9px}
.lang{display:flex;gap:6px}
.lang button{background:transparent;color:#cfd9e8;border:1px solid #2f4a73;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600}
.lang button[aria-pressed=true]{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:44px 0 64px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 16px}
.hero h1 span{color:var(--gold)}
.hero p{font-size:18px;color:#cfd9e8;margin:0 0 26px;max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;background:var(--gold);color:#1b1405;font-weight:700;padding:14px 24px;border-radius:12px;text-decoration:none;box-shadow:0 6px 20px rgba(217,164,65,.28)}
.btn:hover{filter:brightness(1.06)}
.note{font-size:14px;color:#9fb0c6}
.mock{background:var(--card);color:var(--text);border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-width:380px;margin-left:auto;width:100%}
.mock .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mock .doc{font-weight:800;letter-spacing:.05em}
.pill{font-size:12px;font-weight:700;background:#e3f3e8;color:#17653a;border-radius:999px;padding:3px 10px}
.mock .cli{color:var(--muted);font-size:14px;margin-bottom:12px}
.mock .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.mock .tot{display:flex;justify-content:space-between;border-top:2px solid var(--text);margin-top:4px;padding-top:12px;font-weight:800;font-size:18px}
.mock small{display:block;color:var(--muted);margin-top:10px;font-size:12px;text-align:center}
section{padding:56px 0}
h2{font-size:clamp(24px,3.5vw,32px);margin:0 0 8px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 auto 34px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.card .ic{width:42px;height:42px;border-radius:11px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 22px 22px 70px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:20px;top:20px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1b1405;font-weight:800;display:grid;place-items:center}
.step h3{margin:0 0 4px;font-size:17px}.step p{margin:0;color:var(--muted);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:760px;margin:0 auto}
.plan{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px}
.plan.pro{border:2px solid var(--gold)}
.plan h3{margin:0 0 4px;font-size:20px}
.plan .tag{color:var(--muted);font-size:14px;margin-bottom:14px}
.plan ul{list-style:none;padding:0;margin:0}
.plan li{padding:6px 0 6px 26px;position:relative;font-size:15px}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:800}
.final{background:var(--navy);color:#fff;text-align:center;border-radius:22px;padding:48px 24px}
.final h2{color:#fff}.final p{color:#cfd9e8;margin:0 auto 22px;max-width:520px}
footer{padding:34px 0 46px;text-align:center;color:var(--muted);font-size:14px}
footer a{margin:0 8px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:24px}.mock{margin:0 auto}}
</style>
</head>

function setLang(l){
  var d=T[l]||T.es;
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(function(e){var k=e.getAttribute('data-i');if(d[k]!==undefined)e.innerHTML=d[k];});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-l')===l?'true':'false');});
  document.title={es:'TRAZZO – Cotizaciones y documentos para tu negocio',en:'TRAZZO – Quotes and documents for your business',fr:'TRAZZO – Devis et documents pour votre activité'}[l];
  try{localStorage.setItem('trazzo-lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-l'))})});

setLang(start);
